name: CreatorPulse tests
on:
  push:
    branches: ["creatorpulse-open-source-2026-11"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creatorpulse-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: node --check cloudflare/src/worker.mjs
